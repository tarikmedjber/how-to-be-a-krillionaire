<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Wants to Be a Krillianaire — Host</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--accent:#5b4bdb;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--okbg:#e6f4ec;--warnbg:#fdf3e1;--badbg:#fde8e8;--heart:#e0245e}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 16px}
h1,h2,h3{margin:0}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#bbb}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--bad)}
button.small{padding:2px 8px;font-size:12px}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
header h1{font-size:18px;margin-right:auto}
.grid{display:grid;grid-template-columns:270px 1fr 300px;gap:16px;align-items:start;padding-bottom:24px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:10px}
.qlist{max-height:70vh;overflow:auto;margin-top:8px}
.qcat{font-size:12px;color:var(--mute);text-transform:uppercase;margin:6px 0 2px;padding:5px 6px;border-radius:6px;cursor:pointer;display:flex;gap:4px;font-weight:600}
.qcat:hover{background:#f0eff9}
.qcat .n{margin-left:auto;font-weight:400}
.qitem{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.qitem:hover{background:#f0eff9}
.qitem.active{background:var(--accent);color:#fff}
.qitem.used{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.qitem.used:hover{background:none}
.qitem .n{font-size:11px;opacity:.7;white-space:nowrap}
.prompt{font-size:24px;font-weight:650;margin:4px 0 6px}
.meta{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--mute);text-transform:uppercase;font-weight:600}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.verdict-lose{color:var(--bad);font-weight:650}.verdict-safe{color:var(--ok);font-weight:650}
.answers{columns:3 160px;column-gap:16px;margin-top:8px;max-height:45vh;overflow:auto}
.answers div{break-inside:avoid;padding:2px 4px;border-radius:4px}
.answers .taken{background:#fde8e8;color:var(--bad);font-weight:600}
.answers .picked{background:var(--okbg);color:var(--ok);font-weight:600}
.answers .deb{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.player .name{flex:1;font-weight:600}
.player.out{opacity:.4}.player.out .name{text-decoration:line-through}
.hearts{color:var(--heart);letter-spacing:1px;font-size:16px}
.hearts .e{color:#ddd}
.log{font-size:12px;color:var(--mute);max-height:220px;overflow:auto;margin-top:8px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.hostrow td{background:#f1eeff;border-bottom:none}
.hostrow td:first-child{border-radius:10px 0 0 10px;padding-left:10px}
.hostrow td:last-child{border-radius:0 10px 10px 0}
.setup{max-width:520px;margin:40px auto}
.setup label{display:block;font-weight:600;margin:14px 0 6px}
.winner{background:linear-gradient(90deg,#ffe58a,#ffd1e8);padding:14px;border-radius:12px;font-size:20px;font-weight:700;text-align:center;margin-bottom:12px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:24px 0}
.board .card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line);text-align:center}
.board .card .name{font-size:28px;font-weight:700}
.board .card .hearts{font-size:34px}
.board .card.out{opacity:.35}
.anscell{position:relative}
.anscell input.target{outline:2px solid var(--accent);outline-offset:1px}
.answers div[data-ref]{cursor:pointer}
.answers div[data-ref]:hover{outline:1px solid var(--accent)}
.sug{position:absolute;left:4px;right:4px;top:calc(100% - 4px);z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);overflow:hidden}
.sug div{padding:6px 10px;cursor:pointer}
.sug div.on,.sug div:hover{background:#f0eff9}
.sug .meta{margin-left:4px}
[hidden]{display:none!important}
</style>

<div id="app"></div>

// ---------- Derived questions: filters over the base lists above ----------
// Appended after the hand-written ones so existing question ids stay stable.
(function(){
  const base = k => BANK.find(b=>b.key===k);
  const raws = k => base(k).a.split(",").map(s=>s.trim()).filter(Boolean);
  const canon = r => r.split("|")[0].replace(/\*$/,"");
  const isDeb = r => /\*/.test(r);
  const letters = c => c.toLowerCase().normalize("NFD").replace(/[^a-z]/g,"");

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/&/g," and ").replace(/^\s*the\s+/,"").replace(/\bst\.?\s/g,"saint ").replace(/[^a-z0-9+#]/g,"");
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

function parseAnswers(q){
  if(q._parsed) return q._parsed;
  const list = (Array.isArray(q.a)?q.a:q.a.split(",")).map(x=>x.trim()).filter(Boolean).map(raw=>{
    const names = raw.split("|").map(s=>s.trim());
    const deb = names.some(n=>n.endsWith("*"));
    const clean = names.map(n=>n.replace(/\*$/,""));
    return {canon:clean[0], aliases:clean, keys:clean.map(norm), deb};
  });
  return q._parsed = list;
}
function findMatch(q,text){
  const t = norm(text); if(!t) return null;
  const list = parseAnswers(q);
  for(const e of list) if(e.keys.includes(t)) return {e,fuzzy:false};
  let best=null,bd=99;
  for(const e of list) for(const k of e.keys){const d=lev(t,k); if(d<bd){bd=d;best=e}}
  const tol = t.length<=4?0:t.length<=7?1:2;
  return best && bd<=tol ? {e:best,fuzzy:true} : null;
}
// Type-ahead: prefix > contains > misspelled prefix, best 6 distinct answers.
function suggest(q,text){
  const t = norm(text); if(!t) return [];
  const tol = t.length<3?0:Math.max(1,Math.floor(t.length/3));
  const scored = [];
  for(const e of parseAnswers(q)){
    let best = 99, via = e.canon;
    e.keys.forEach((k,i)=>{
      let s = k.startsWith(t)?0 : k.includes(t)?1 : (()=>{const d=Math.min(lev(t,k.slice(0,t.length)),lev(t,k));return d<=tol?2+d:99})();
      if(s<best){best=s;via=e.aliases[i]}
    });
    if(best<99) scored.push({e,s:best,via});
  }
  scored.sort((a,b)=>a.s-b.s||a.e.canon.length-b.e.canon.length);
  const out = scored.slice(0,6);
  return out.length===1 && norm(out[0].e.canon)===t ? [] : out;
}
const keyFor = (q,text) => { const m=findMatch(q,text); return m ? "c:"+m.e.canon : "n:"+norm(text); };

function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}

const allQs = () => [...BANK.map((q,i)=>({...q,id:"b"+i})), ...S.custom.map((q,i)=>({...q,id:"c"+i,cat:"Custom"}))];
const qById = id => { const q = allQs().find(q=>q.id===id); if(q){ const src = id[0]==="b"?BANK[+id.slice(1)]:S.custom[+id.slice(1)]; q._parsed = parseAnswers(src);} return q; };
const alive = () => S.players.filter(p=>p.lives>0);
function snapshot(){ const {undo,...rest}=S; S.undo.push(JSON.stringify(rest)); if(S.undo.length>30) S.undo.shift(); }
function undo(){ const u=S.undo.pop(); if(!u) return; const undoStack=S.undo; S=JSON.parse(u); S.undo=undoStack; save(); }

// ---------- Round evaluation ----------
function evaluate(){
  const q = S.current && qById(S.current); if(!q) return [];
  const rows = alive().map(p=>{
    const text = (S.answers[p.id]||"").trim();
    const r = {p,text,reasons:[],match:null};
    if(!text){ r.blank=true; if(S.blankLoses) r.reasons.push(["bad","No answer"]); return r; }
    const m = findMatch(q,text); r.match=m; r.key=keyFor(q,text);
    if(m){ r.reasons.push([m.fuzzy?"warn":"ok", (m.fuzzy?"≈ ":"✓ ")+m.e.canon]); if(m.e.deb) r.reasons.push(["warn","debatable"]); }
    else if(q.open) r.reasons.push(["warn","Not in list — your call"]);
    else { r.reasons.push(["bad","Not in list"]); if(S.invalidLoses) r.invalid=true; }
    return r;
  });
  const counts={}; rows.forEach(r=>{ if(r.key) (counts[r.key]=counts[r.key]||[]).push(r.p.name) });
  const host = hostEval(q);
  if(host && host.key) (counts[host.key]=counts[host.key]||[]).push("Host");
  rows.forEach(r=>{
    const others = r.key ? counts[r.key].filter(n=>n!==r.p.name) : [];
    // Playing against the host: only matching the host counts, player-vs-player matches are fine.
    if(host){
      if(others.includes("Host")){ r.clash=true; r.reasons.push(["bad","Clash: Host"]); }
      const peers = others.filter(n=>n!=="Host");
      if(peers.length) r.reasons.push(["ok","Same as "+peers.join(", ")+" (fine)"]);
    } else if(others.length){ r.clash=true; r.reasons.push(["bad","Clash: "+others.join(", ")]); }
    const auto = (r.blank&&S.blankLoses)||r.invalid||r.clash;
    const ov = S.overrides[r.p.id];
    r.loses = ov==="safe"?false: ov==="lose"?true: !!auto;
    r.ov = ov||"auto";
  });
  return rows;
}
// The host plays as an extra answer that can't lose lives; players clash with it like anyone else.
function hostEval(q){
  if(!S.secret.on || !q) return null;
  const text=(S.answers.host||"").trim();
  if(!text) return {text, reasons:[["warn","Enter your answer"]]};
  const m=findMatch(q,text);
  return {text, match:m, key:keyFor(q,text),
    reasons:[m ? [m.fuzzy?"warn":"ok",(m.fuzzy?"≈ ":"✓ ")+m.e.canon] : ["warn","Not in list"]]};
}
function applyRound(){
  const q=qById(S.current); const rows=evaluate(); if(!q||!rows.length) return;
  snapshot();
  const losers = rows.filter(r=>r.loses);
  losers.forEach(r=>{ const p=S.players.find(x=>x.id===r.p.id); p.lives=Math.max(0,p.lives-1); });
  S.log.unshift(`<b>${esc(q.q)}</b> — ${losers.length? "lost a life: "+losers.map(r=>esc(r.p.name)+(r.text?` (“${esc(r.text)}”)`:"")).join(", ") : "nobody lost a life"}`+
    (S.secret.on&&(S.answers.host||"").trim()?` · host said “${esc(S.answers.host.trim())}”`:""));
  if(!S.used.includes(S.current)) S.used.push(S.current);
  S.answers={}; S.overrides={}; S.secret.list=[]; S.secret.shown=false;
  S.current=null; aFilter="";
  save();
}

        <h2>Answer reference <span style="text-transform:none;font-weight:400">— <span style="color:var(--bad)">red</span> = clash, <span style="color:var(--ok)">green</span> = given/safe, <span style="color:var(--warn)">amber</span> = debatable</span></h2>
        <input data-f="af" id="af" placeholder="Look up an answer…" value="${esc(aFilter)}">
        <div class="meta" id="refHint" style="margin-top:6px"></div>
        <div class="answers">${ansList.map(e=>{
          const cls = clashKeys.has(e.canon)?"taken":takenKeys.has(e.canon)?"picked":e.deb?"deb":"";
          return `<div class="${cls}" data-ref="${esc(e.canon)}" title="${esc(e.aliases.join(" / "))}">${esc(e.canon)}${e.aliases.length>1?` <span class="meta">(${esc(e.aliases.slice(1).join(", "))})</span>`:""}${e.deb?" *":""}</div>`}).join("")||'<span class="meta">No match in list.</span>'}</div>
      </div>`:""}
    </div>

    <div class="panel">
      <h2>Lives · ${al.length} of ${S.players.length} left</h2>
      ${S.players.map(p=>`<div class="player ${p.lives<=0?"out":""}">
        <span class="name">${esc(p.name)}</span>${hearts(p.lives,S.startLives)}
        <button class="small" data-dec="${p.id}">−</button><button class="small" data-inc="${p.id}">+</button></div>`).join("")}
      <div class="row" style="margin-top:10px"><input id="newP" placeholder="Add player…"><button id="addP">Add</button></div>
      <label class="row" style="margin-top:12px"><input type="checkbox" id="blank" style="width:auto" ${S.blankLoses?"checked":""}> No answer loses a life</label>
      <label class="row"><input type="checkbox" id="invalid" style="width:auto" ${S.invalidLoses?"checked":""}> Wrong answer (not in list) loses a life</label>
      <h2 style="margin-top:16px">History</h2>
      <div class="log">${S.log.map(l=>`<div>${l}</div>`).join("")||"Nothing yet."}</div>
    </div>
  </div>`;
  updateRefHint();
  if(focus){ const el=document.querySelector(`[data-f="${focus}"]`); if(el){ el.focus(); try{el.setSelectionRange(caret,caret)}catch(e){} } }
}

function ansCell(id,text){
  id=String(id);
  const s = String(sugFor)===id ? currentSugs() : [];
  return `<td class="anscell"><input data-f="a${id}" data-ans="${id}" class="${id===refTarget()?"target":""}" value="${esc(text)}" placeholder="${id==="host"?"your answer…":"type answer…"}" autocomplete="off">${
    s.length?`<div class="sug">${s.map((x,i)=>`<div class="${i===sugIdx?"on":""}" data-pick="${id}" data-val="${esc(x.e.canon)}">${esc(x.e.canon)}${x.via!==x.e.canon?`<span class="meta">(${esc(x.via)})</span>`:""}</div>`).join("")}</div>`:""}</td>`;
}

function updateRefHint(){
  const h=$("#refHint"); if(!h) return;
  const id=refTarget(), p=id==="host"?{name:"you (host)"}:id&&S.players.find(x=>String(x.id)===id);
  h.innerHTML = p ? `👆 Click an answer to fill it in for <b>${esc(p.name)}</b>` : "Everyone has an answer. Click a player's box first to change theirs.";
}

function renderSetup(){
  $("#app").innerHTML = `<div class="setup panel">
    <h1>🎯 Who Wants to Be a Krillianaire</h1>
    <p class="meta">Everyone answers. If anyone else gives the same answer, you both lose a life. Last one standing wins.</p>
    <label>Players (one per line)</label>
    <textarea id="names" rows="10" placeholder="Alice\nBob\nCharlie">${esc(S.players.map(p=>p.name).join("\n"))}</textarea>
    <label>Lives each</label>
    <div class="row"><button class="lv ${S.startLives==3?"primary":""}" data-l="3">3</button><button class="lv ${S.startLives==5?"primary":""}" data-l="5">5</button>
      <input type="number" id="lives" min="1" max="20" value="${S.startLives}" style="width:80px"></div>
    <div style="margin-top:20px"><button id="start" class="primary">Start game →</button></div>
  </div>`;
}

function renderBoard(){
  document.title="Scoreboard";
  $("#app").innerHTML = `<header><h1>🎯 Who Wants to Be a Krillianaire — ${alive().length} still in</h1></header>
  <div class="board">${S.players.map(p=>`<div class="card ${p.lives<=0?"out":""}"><div class="name">${esc(p.name)}</div>${p.lives>0?hearts(p.lives,S.startLives):'<div style="font-size:28px">OUT</div>'}</div>`).join("")}</div>`;
}

// ---------- Events ----------
document.addEventListener("mousedown",e=>{
  const s=e.target.closest("[data-pick]"); if(!s) return;
  e.preventDefault(); pick(s.dataset.pick,s.dataset.val);
});
document.addEventListener("focusin",e=>{
  const id=e.target.dataset&&e.target.dataset.ans;
  if(id && lastAns!==id){ lastAns=id; document.querySelectorAll("[data-ans]").forEach(x=>x.classList.toggle("target",x.dataset.ans===id)); updateRefHint(); }
  if(id && String(sugFor)!==id && justPicked!==id){ sugFor=id; sugIdx=0; render(); }
});
document.addEventListener("click",e=>{
  if(sugFor!=null && !e.target.closest("[data-ans],.sug")){ sugFor=null; if(!e.target.closest("button,[data-q]")) render(); }
  const cat=e.target.closest("[data-cat]");
  if(cat){ const c=cat.dataset.cat; openCats.has(c)?openCats.delete(c):openCats.add(c); return render(); }
  const t=e.target.closest("button,[data-q],[data-ref]"); if(!t) return;
  if(t.dataset.ref) return fillFromRef(t.dataset.ref);
  if(t.dataset.q||["rand","apply","clearAns"].includes(t.id)) lastAns=null;
  if(t.dataset.q && S.used.includes(t.dataset.q)) return alertBox("That question has already been used this game.");
  if(t.dataset.q){ S.current=t.dataset.q; S.answers={}; S.overrides={}; S.secret.list=[]; S.secret.shown=false; aFilter=""; S.secret.on = alive().length<=2; return save(); }
  if(t.classList.contains("lv")){ S.startLives=+t.dataset.l; return save(); }
  if(t.dataset.dec||t.dataset.inc){ snapshot(); const p=S.players.find(x=>x.id==(t.dataset.dec||t.dataset.inc)); p.lives=Math.max(0,p.lives+(t.dataset.dec?-1:1)); return save(); }
  switch(t.id){
    case "start": {
      const names=$("#names").value.split("\n").map(s=>s.trim()).filter(Boolean);
      if(names.length<2) return alertBox("Add at least two players.");
      const lives=Math.max(1,+$("#lives").value||5);
      S.startLives=lives; S.players=names.map((n,i)=>({id:i+1,name:n,lives})); S.phase="play"; S.log=[]; S.used=[]; S.undo=[]; S.current=null; return save();
    }
    case "newgame": if(t.dataset.confirm){ S.phase="setup"; S.players.forEach(p=>p.lives=S.startLives); return save(); } t.dataset.confirm=1; t.textContent="Click again to confirm"; setTimeout(()=>{t.textContent="New game";delete t.dataset.confirm},3000); return;
    case "undo": return undo();
    case "board": return window.open(location.pathname+"#board","board","width=1100,height=700");
    case "rand": { const pool=allQs().filter(x=>!S.used.includes(x.id)&&x.id!==S.current); if(!pool.length) return; const x=pool[Math.floor(Math.random()*pool.length)];
      S.current=x.id; S.answers={}; S.overrides={}; S.secret.list=[]; S.secret.shown=false; S.secret.on=alive().length<=2; aFilter=""; return save(); }
    case "apply": return applyRound();
    case "clearAns": S.answers={}; S.overrides={}; return save();
    case "hostRand": { const list=parseAnswers(qById(S.current)).filter(e=>!e.deb); S.answers.host=list[Math.floor(Math.random()*list.length)].canon; return save(); }
    case "addP": { const n=$("#newP").value.trim(); if(!n) return; snapshot(); S.players.push({id:Math.max(0,...S.players.map(p=>p.id))+1,name:n,lives:S.startLives}); return save(); }
    case "addq": { const qq=$("#cq").value.trim(), aa=$("#ca").value.trim(); if(!qq) return alertBox("Enter a question.");
      S.custom.push({q:qq,a:aa,open:$("#co").checked||!aa}); return save(); }
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.ans){ S.answers[t.dataset.ans]=t.value; sugFor=t.dataset.ans; sugIdx=0; return save(); }
  if(t.id==="qf"){ qFilter=t.value; return render(); }
  if(t.id==="af"){ aFilter=t.value; return render(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ov){ S.overrides[t.dataset.ov]= t.value==="auto"?undefined:t.value; return save(); }
  if(t.id==="secOn"){ S.secret.on=t.checked; return save(); }
  if(t.id==="blank"){ S.blankLoses=t.checked; return save(); }
  if(t.id==="invalid"){ S.invalidLoses=t.checked; return save(); }
  if(t.id==="lives"){ S.startLives=Math.max(1,+t.value||5); return save(); }
});
document.addEventListener("keydown",e=>{
  if(e.target.dataset.ans && sugFor!=null){
    const s=currentSugs();
    if(s.length && (e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); sugIdx=(sugIdx+(e.key==="ArrowDown"?1:-1)+s.length)%s.length; return render(); }
    if(e.key==="Escape"){ sugFor=null; return render(); }
    if(e.key==="Enter" && s.length){ const pid=e.target.dataset.ans; pick(pid,s[Math.min(sugIdx,s.length-1)].e.canon);
      const ins=[...document.querySelectorAll("[data-ans]")]; const i=ins.findIndex(x=>x.dataset.ans===pid); if(ins[i+1]) ins[i+1].focus(); return; }
  }
  if(e.key!=="Enter") return;
  if(e.target.id==="newP") return $("#addP").click();
  if(e.target.dataset.ans){ const ins=[...document.querySelectorAll("[data-ans]")]; const i=ins.indexOf(e.target); if(ins[i+1]) ins[i+1].focus(); }
});
function alertBox(msg){ const d=document.createElement("div"); d.textContent=msg; d.style.cssText="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#c53030;color:#fff;padding:10px 16px;border-radius:8px;z-index:9"; document.body.appendChild(d); setTimeout(()=>d.remove(),2500); }
// Keep the scoreboard window in sync with the host window.
window.addEventListener("storage",e=>{ if(e.key===LS){ S=load()||S; render(); } });
window.addEventListener("hashchange",render);
render();
</script>
